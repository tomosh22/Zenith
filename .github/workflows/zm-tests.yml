# Zenithmon tests (active PR gate from S0 -- see Games/Zenithmon/Docs/CIPolicy.md).
#
# Modeled on dp-tests.yml (the proven GPU-less gate; see its header for the
# full history of the headless-boot approach). Summary of the constraints:
#   - GitHub-hosted windows-latest runners have no GPU / Vulkan ICD. Headless is
#     a BUILD CONFIG: the Null_* configs compile the GPU-less Zenith/Null backend
#     and create the window hidden, so every render path RUNS against no-op
#     backend calls instead of being skipped by a runtime branch. Only tests that
#     read PIXELS (m_bRequiresGraphics) are skipped.
#   - Baked assets are git-ignored, so a fresh checkout has NO Assets/ content;
#     asset/scene-dependent automated tests must exists-guard and RequestSkip
#     (the commit-94813489 pattern). The CI backbone is the pure-logic headless
#     suites (boot unit tests + headless automated tests).
#   - slang-llvm.dll is > 100 MB, so Slang DLLs are fetched per run by
#     .github/actions/zenith-setup, never committed.
#
# Required check name: `zm-tests` (branch protection is a manual GitHub-UI
# step -- Games/Zenithmon/Docs/ManualSetupChecklist.md).

name: zm-tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner override (e.g. self-hosted with GPU).'
        required: false
        default: 'windows-latest'

permissions:
  contents: read

# Superseded PR pushes cancel the in-flight run; master pushes always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zm-tests:
    name: zm-tests
    runs-on: ${{ github.event.inputs.runner || 'windows-latest' }}
    timeout-minutes: 60

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      VCPKG_DISABLE_METRICS: 1
      SLANG_VERSION: '2026.1'
      VULKAN_SDK_VERSION: '1.3.290.0'
      # Single source for where the runner writes + the artifact uploads from.
      ZM_RESULTS_DIR: Build/artifacts/test_results/zenithmon

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision Zenith toolchain (MSBuild + vcpkg + Vulkan + Slang)
        uses: ./.github/actions/zenith-setup
        with:
          vulkan-sdk-version: ${{ env.VULKAN_SDK_VERSION }}
          slang-version: ${{ env.SLANG_VERSION }}

      - name: Regenerate solution (Sharpmake)
        shell: pwsh
        working-directory: Build
        run: |
          ./regen.ps1 -UseDotnet
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build Zenithmon
        shell: pwsh
        run: |
          msbuild Games\Zenithmon\zenithmon_win64.sln `
              /t:Zenithmon `
              /p:Configuration=Vulkan_vs2022_Debug_Win64_True `
              /p:Platform=x64 `
              /p:WindowsTargetPlatformVersion=10.0 `
              -maxCpuCount `
              -nologo `
              -clp:Summary `
              -clp:ErrorsOnly
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build Zenithmon (Null backend -- THE headless/CI build)
        shell: pwsh
        run: |
          # Everything below this point runs THIS exe. The Vulkan build above stays
          # as a compile proof for the real renderer; it is never executed here (a
          # Vulkan boot hangs in vkEnumeratePhysicalDevices on a GPU-less runner).
          msbuild Games\Zenithmon\zenithmon_win64.sln `
              /t:Zenithmon `
              /p:Configuration=Null_vs2022_Debug_Win64_True `
              /p:Platform=x64 `
              /p:WindowsTargetPlatformVersion=10.0 `
              -maxCpuCount `
              -nologo `
              -clp:Summary `
              -clp:ErrorsOnly
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build Zenithmon (D3D12 null backend -- backend-neutrality link proof)
        shell: pwsh
        run: |
          # The D3D12 null backend is a compile + link conformance oracle proving
          # the Flux renderer surface is backend-neutral (zero real rendering;
          # Vulkan stays the shipping backend). _False omits editor/tools +
          # Slang/Vulkan and links the system d3d12/dxgi import libs only.
          msbuild Games\Zenithmon\zenithmon_win64.sln `
              /t:Zenithmon `
              /p:Configuration=D3D12_vs2022_Debug_Win64_False `
              /p:Platform=x64 `
              /p:WindowsTargetPlatformVersion=10.0 `
              -maxCpuCount `
              -nologo `
              -clp:Summary `
              -clp:ErrorsOnly
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Copy runtime DLLs into exe output dir
        shell: pwsh
        run: |
          $exeDir = 'Games\Zenithmon\Build\output\win64\null_vs2022_debug_win64_true'
          if (-not (Test-Path $exeDir)) {
              Write-Error "exe output dir does not exist: $exeDir"
              exit 1
          }
          # Repair-ZenithRuntimeDlls is the single source of truth for what an exe
          # dir needs: the whole slang dependency tree (the post-build event only
          # copies slang.dll) plus the assimp runtime tree. A FIRST build in a new
          # config leaves those absent and the exe dies with STATUS_DLL_NOT_FOUND
          # (exit 0xC0000135) before main() -- an empty log that reads as a build
          # failure. No vulkan-1.dll: the Null backend never loads a Vulkan loader.
          # NOTE the .\ prefix: without a leading dot PowerShell reads the argument
          # as a MODULE NAME and searches $PSModulePath, not the repo.
          Import-Module .\Build\zenith_buildsystem.psm1 -Force
          $copied = Repair-ZenithRuntimeDlls -ExeDir (Resolve-Path $exeDir).Path
          Write-Host "healed $($copied.Count) runtime DLL(s): $($copied -join ', ')"
          Write-Host "DLLs in exe output dir:"
          Get-ChildItem "$exeDir\*.dll" | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}} | Sort-Object Name | Format-Table -AutoSize | Out-String | Write-Host

      - name: Verify exe boots far enough to enumerate tests
        shell: pwsh
        run: |
          $exe = 'Games\Zenithmon\Build\output\win64\null_vs2022_debug_win64_true\zenithmon.exe'
          # --list-automated-tests exits 0 cleanly without entering the main loop.
          # The Null build creates no Vulkan instance at all, so
          # vkEnumeratePhysicalDevices never runs on the GPU-less runner.
          $out = & $exe --list-automated-tests --skip-tool-exports --skip-unit-tests 2>&1
          $code = $LASTEXITCODE
          Write-Host "exe --list exited $code; first 30 lines:"
          $out | Select-Object -First 30 | Out-Host
          if ($code -ne 0) {
              Write-Host "... tail (last 40 lines) ..."
              $out | Select-Object -Last 40 | Out-Host
              Write-Error "exe failed to enumerate tests (exit $code) -- engine can't boot on this runner."
              exit 1
          }

      - name: Run boot unit tests (engine + Zenithmon ZM_* suites)
        shell: pwsh
        run: |
          # The enumerate step and `zenith test` both pass --skip-unit-tests for
          # speed, so the boot ZENITH_TEST suite -- engine units PLUS Zenithmon's
          # ZM_* data-core cases (the S1+ gate backbone) -- is exercised here via the
          # shared engine-gate helper. It boots the Null exe with tool-exports ON
          # (some engine unit tests reload generated assets), watchdog-kills the
          # known tools-build idle after the units line is logged, and asserts the
          # full registered count ran with 0 failed. Bump -Baseline when the ZM_*
          # (or engine) unit-test count changes -- see Docs/CIPolicy.md.
          #
          # -TimeoutSec IS NOT OPTIONAL HERE, and the default was actively dangerous.
          # run_unit_gate.ps1 defaults to 180s, but the watchdog exists to kill the
          # known tools-build IDLE *after* the units line is logged -- it is a hang
          # guard, not a runtime budget. Because the units line has to be written
          # before the kill, the timeout silently doubles as a ceiling on how long the
          # unit suite may take. MEASURED 2026-07-29 on an idle dev machine, seconds
          # from process start to the "Unit tests complete" line: 175, 193, 229, 235
          # -- i.e. the suite STRADDLES the old 180s default, and which side it lands
          # on is decided by machine load, not by the code under test. When it loses
          # that race the gate reports "no 'Unit tests complete' line in boot output",
          # which reads like a crash or a DLL load failure and sends the next person
          # hunting a phantom. 600s is pure headroom: a genuinely hung boot still
          # fails, just later. See ZM-D-163.
          #
          # ★ THIS PIN IS SET FROM AN OBSERVED LINE, NEVER ARITHMETIC. ZM-D-173
          # found the previous one already wrong -- it read 2804 while a clean
          # HEAD build produced 2809, so this gate was RED on master before that
          # work started. Whoever moves it runs a clean Null_ build, reads the
          # "Unit tests complete: N ran" line, and pastes N here.
          #
          # History, newest first (the DERIVATION is the audit trail; the OBSERVED
          # number is the authority):
          #   2925  terrain exporter border chunks  observed 2026-08-06 on a Null_
          #                   build. +5: Flux/Terrain/Flux_Terrain.Tests.inl gained the
          #                   FluxTerrainSourceGrid suite (Flux_TerrainSourceGrid.h) when
          #                   the exporter was found to bake INCOMPLETE chunks at the
          #                   positive grid border -- its source grid was one sample per
          #                   edge short, so the last chunk column/row had no neighbour to
          #                   stitch from and 127 of 4096 chunks were silently dropped from
          #                   LOW LOD and physics alike. All five are ENGINE units, so the
          #                   engine default moves in lockstep: 1295 -> 1300.
          #   2920  terrain wireframe under TAA  observed 2026-08-06 on a Null_
          #                   build. +11 over the PIN of 2909, which was ALREADY STALE
          #                   by 5: the CommandLine ParseArgs characterization tests
          #                   (2026-08-05) moved run_unit_gate.ps1's engine default
          #                   1284 -> 1289 and did not move this pin, so HEAD was really
          #                   2914 and this gate was RED before this work started.
          #                   +6 new: Flux/Terrain/Flux_Terrain.Tests.inl -- the terrain
          #                   G-buffer pipeline variant 2x2, added when the terrain
          #                   "Wireframe" checkbox was found dead in every default run
          #                   (the TAA velocity latch beat the wireframe flag, and TAA
          #                   ships ON). All six are ENGINE units, so the engine default
          #                   moves in lockstep: 1289 -> 1295.
          #   2909  ZM-D-184 rival spawn clearance  observed 2026-08-04 on a Null_
          #                   build. +1: ZM_Interaction/
          #                   Vesper_SpawnsClearOfTheGroundNotOnIt. The engine half of
          #                   ZM-D-184 (the physics substep cap) adds no unit of its
          #                   own; it is covered by the ZM automated tests that load
          #                   Dawnmere. Engine default stays 1284.
          #   2908  ZM-D-183 frozen rival facing  observed 2026-08-04 on a Null_
          #                   build. +2: ZM_Interaction/
          #                   Vesper_FrozenFacingIsExactlyTheDeclaredBits and the new
          #                   TU Tests/ZM_Tests_CommittedSceneBytes.cpp's
          #                   DawnmereCarriesTheFrozenRivalFacingBitExactly -- the
          #                   first headless guard on the COMMITTED .zscen bytes.
          #                   Engine-side count unmoved (the new automation step has
          #                   no unit of its own; it is covered by the ZM units that
          #                   ride it). Engine default stays 1284.
          #   2906  swapchain policy  observed 2026-08-04 on a Null_ build. +13:
          #                   Flux/Flux_SwapchainPolicy.Tests.inl -- the surface
          #                   preTransform / zero-extent / SUBOPTIMAL-rebuild
          #                   decisions, pulled OUT of Zenith/Vulkan so they are
          #                   reachable at all from a Null_ build (the backend is
          #                   build-excluded from it). Engine default 1271 -> 1284.
          #   2893  exit-after-unit-tests  observed 2026-08-03 on a Null_ build.
          #                   +1: CommandLine::ExitAfterUnitTestsIsNotAnAutomatedTestRun.
          #                   The gate now boots with --exit-after-unit-tests and the exe
          #                   self-terminates, so -TimeoutSec is a real hang guard again
          #                   (a run went 600s -> ~75s). Engine default 1270 -> 1271.
          #   2892  per-test timings  observed 2026-08-03 on a Null_ build. +1:
          #                   Core::UnitTestTimingReport, covering the new
          #                   --unit-test-timings plumbing. Engine default 1269 -> 1270.
          #   2891  boot-profiling  observed 2026-08-03 on a Null_ build. +27 over
          #                   the PIN of 2864, which was ALREADY STALE by 4: the
          #                   shadow-cascade fix (33531b6a) added four engine units
          #                   and moved neither this pin nor the engine default, so
          #                   HEAD was really 2868. +23 new: 18 boot-capture units
          #                   in Zenith_Profiling.Tests.inl (+1 CommandLine boot-flag
          #                   split), 1 dump-coordinator latch unit in
          #                   Zenith_Main.Tests.inl, 1 present-latch unit, 1
          #                   automation-session-gating unit, 2 boot-timeline
          #                   helper units. All are ENGINE units, so
          #                   run_unit_gate.ps1's engine default moves in lockstep:
          #                   1242 -> 1269.
          #   2864  ZM-D-182  observed 2026-08-02 on a clean Null_ build. +1: the
          #                   ZM_HumanVisual rig-rebind unit. run_unit_gate.ps1's
          #                   engine default stays 1242 -- ZM-D-182 added no unit
          #                   under Zenith/.
          #   2863  ZM-D-181  observed. +14 = five explicit-collider ENGINE units
          #                   (which every game inherits, and which took the engine
          #                   gate 1237 -> 1242) + nine game units: five
          #                   ZM_HumanVisual, two ZM_Gen human-anchor, one creature
          #                   origin-policy, one Home-exterior envelope.
          #   2849  ZM-D-180  name tags.
          #   2825  ZM-D-174  +8 ProfLab placement units.
          #   2817  ZM-D-173  = 2809 + 8: four ENGINE sensor-raycast units plus
          #                   two camera fixtures and two Home-placement units.
          $exe = 'Games\Zenithmon\Build\output\win64\null_vs2022_debug_win64_true\zenithmon.exe'
          pwsh -NoProfile -File Tools\run_unit_gate.ps1 -Exe $exe -Baseline 2925 -TimeoutSec 600
          if ($LASTEXITCODE -ne 0) { Write-Error "boot unit tests failed (see log above)"; exit $LASTEXITCODE }

      - name: Run Zenithmon tests
        shell: pwsh
        run: |
          # zenith test batches every registered test in ONE process. --headless
          # selects the Null-backend exe built above; pixel-reading tests
          # (m_bRequiresGraphics) are skipped there, and asset-dependent tests
          # RequestSkip on the assets-absent checkout.
          & .\zenith.bat test Zenithmon --headless --results-dir $env:ZM_RESULTS_DIR
          $testExit = $LASTEXITCODE
          Write-Host "zenith test exit: $testExit"
          if ($testExit -ne 0) { exit $testExit }

      - name: Upload test result JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zm-test-results
          path: ${{ env.ZM_RESULTS_DIR }}/
          if-no-files-found: warn

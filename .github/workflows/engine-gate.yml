# Engine gate -- the two engine-level proofs no game workflow covers:
#
#   1. Sentinel leaf-purity links (SentinelECS / SentinelPhysics / SentinelAI):
#      exes that link EXACTLY the leaf libs (zenithbase/ecs/physics/ai) with no
#      aggregate engine. They exist only in ToolsEnabled=False configs
#      (Sharpmake_Solutions.cs) and an accidental leaf->engine edge fails their
#      link with a hard unresolved external. Fixed + green as of 2026-07
#      (the leaf seams are enumerated in Tests/Sentinel*/sentinel_platform.cpp).
#      Built + run in Vulkan_ AND Null_ since 2026-08: a Vulkan-only sentinel step
#      cannot see PCH-include rot, because vulkan.hpp still leaks <Windows.h> into
#      every TU. See the note on the build step.
#   2. The engine unit-test suite at boot (dedicated gate; the game test
#      workflows run with --skip-unit-tests). Combat carries the gate: its
#      Vulkan_Debug_True build also proves the engine lib transitively.
#
# Baseline lives in Tools/run_unit_gate.ps1 (-Baseline default); bump it there
# when adding engine unit tests (Tools/test_scaffold.ps1 reuses the same script,
# so there is exactly one place to bump).
#
# Rollout: land with workflow_dispatch; enable pull_request/push after two
# green dispatch runs; mark required after a week of burn-in.
# Required check name (eventually): `engine-gate`.
#
# Android/AGDE deliberately NOT covered here: the AGDE VSIX is absent from
# hosted runners and slow/flaky to install; descriptor-level AGDE generation
# is already exercised by every workflow's regen step. Revisit when a
# self-hosted runner exists.

name: engine-gate

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner override (e.g. self-hosted with GPU).'
        required: false
        default: 'windows-latest'

permissions:
  contents: read

# Superseded PR pushes cancel the in-flight run; master pushes always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine-gate:
    name: engine-gate
    runs-on: ${{ github.event.inputs.runner || 'windows-latest' }}
    timeout-minutes: 75

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      VCPKG_DISABLE_METRICS: 1
      SLANG_VERSION: '2026.1'
      VULKAN_SDK_VERSION: '1.3.290.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The engine unit gate runs the tool asset exports at boot:
          # run_unit_gate.ps1 deliberately omits --skip-tool-exports so the
          # asset-export unit tests (ProceduralTree::*, StickFigure*) find their
          # generated assets. Those exports read the LFS-tracked SOURCE meshes +
          # textures (*.fbx/*.png/*.tga/*.dds/... per .gitattributes). Without
          # lfs:true actions/checkout leaves those as LFS pointer files, and the
          # export crashes on boot (right after "AssetRegistry initialized",
          # before any unit test). cb/dp-tests pass without LFS only because they
          # run --skip-tool-exports. Same fix as shader-validation.yml.
          lfs: true

      - name: Provision Zenith toolchain (MSBuild + vcpkg + Vulkan + Slang)
        uses: ./.github/actions/zenith-setup
        with:
          vulkan-sdk-version: ${{ env.VULKAN_SDK_VERSION }}
          slang-version: ${{ env.SLANG_VERSION }}

      - name: Regenerate solution (Sharpmake)
        shell: pwsh
        working-directory: Build
        run: |
          ./regen.ps1 -UseDotnet
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build Sentinels (leaf-purity link proof, Vulkan + Null _False)
        shell: pwsh
        run: |
          # Sentinels exist ONLY in ToolsEnabled=False configs. Each /t: is a
          # separate invocation so a failure names its sentinel.
          #
          # BOTH render backends, deliberately. W5.2 took <Windows.h> out of the PCH,
          # but a Vulkan_ config still pulls it transitively via Flux.h -> vulkan.hpp;
          # Null_ and D3D12_ include no Vulkan at all. A Vulkan-only gate therefore
          # compiles a TU that names a Win32 type WITHOUT Core/Zenith_Win32.h perfectly
          # green -- which is exactly how all three Tests/Sentinel*/sentinel_platform.cpp
          # sat with an undefined CRITICAL_SECTION (5x C2061 each) while this gate
          # reported success. Null_ is the cheap half of the pair (no Vulkan SDK headers
          # in the PCH) and catches that whole class; D3D12_ fails the same way and is
          # omitted only to keep the step short.
          foreach ($cfg in @('Vulkan_vs2022_Debug_Win64_False', 'Null_vs2022_Debug_Win64_False')) {
              foreach ($t in @('SentinelECS', 'SentinelPhysics', 'SentinelAI')) {
                  msbuild Build\zenith_engine_win64.sln `
                      /t:$t `
                      /p:Configuration=$cfg `
                      /p:Platform=x64 `
                      /p:WindowsTargetPlatformVersion=10.0 `
                      -maxCpuCount -nologo -clp:Summary -clp:ErrorsOnly
                  if ($LASTEXITCODE -ne 0) { Write-Error "$t failed ($cfg)"; exit 1 }
              }
          }

      - name: Run Sentinels (leaf-proof exes execute clean)
        shell: pwsh
        run: |
          # Output dir is the lowercased config name (see CLAUDE.md build section).
          foreach ($cfg in @('Vulkan_vs2022_Debug_Win64_False', 'Null_vs2022_Debug_Win64_False')) {
              $dir = "Build\output\win64\$($cfg.ToLower())"
              foreach ($s in @('sentinelecs', 'sentinelphysics', 'sentinelai')) {
                  & "$dir\$s.exe"
                  if ($LASTEXITCODE -ne 0) { Write-Error "$s exited $LASTEXITCODE ($cfg)"; exit 1 }
                  Write-Host "$s OK ($cfg)"
              }
          }

      - name: Build Combat (Vulkan_Debug_True; engine lib transitively)
        shell: pwsh
        run: |
          msbuild Games\Combat\combat_win64.sln `
              /t:Combat `
              /p:Configuration=Vulkan_vs2022_Debug_Win64_True `
              /p:Platform=x64 `
              /p:WindowsTargetPlatformVersion=10.0 `
              -maxCpuCount -nologo -clp:Summary -clp:ErrorsOnly
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build Combat (Null_Debug_True -- the exe the unit gate runs)
        shell: pwsh
        run: |
          # The unit gate BOOTS an exe, so it needs the GPU-less Null build; the
          # Vulkan build above stays as a compile proof for the real renderer.
          msbuild Games\Combat\combat_win64.sln `
              /t:Combat `
              /p:Configuration=Null_vs2022_Debug_Win64_True `
              /p:Platform=x64 `
              /p:WindowsTargetPlatformVersion=10.0 `
              -maxCpuCount -nologo -clp:Summary -clp:ErrorsOnly
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Copy runtime DLLs into exe output dir
        shell: pwsh
        run: |
          $exeDir = 'Games\Combat\Build\output\win64\null_vs2022_debug_win64_true'
          # Repair-ZenithRuntimeDlls is the single source of truth for what an exe
          # dir needs: the whole slang dependency tree (the post-build event only
          # copies slang.dll) plus the assimp runtime tree. A FIRST build in a new
          # config leaves those absent and the exe dies with STATUS_DLL_NOT_FOUND
          # (exit 0xC0000135) before main() -- an empty log that reads as a build
          # failure. No vulkan-1.dll: the Null backend never loads a Vulkan loader.
          # NOTE the .\ prefix: without a leading dot PowerShell reads the argument
          # as a MODULE NAME and searches $PSModulePath, not the repo.
          Import-Module .\Build\zenith_buildsystem.psm1 -Force
          $copied = Repair-ZenithRuntimeDlls -ExeDir (Resolve-Path $exeDir).Path
          Write-Host "healed $($copied.Count) runtime DLL(s): $($copied -join ', ')"

      - name: Run engine unit tests at boot (baseline + known-flake tolerance)
        shell: pwsh
        run: |
          & pwsh.exe -NoProfile -ExecutionPolicy Bypass -File .\Tools\run_unit_gate.ps1 `
              -Exe 'Games/Combat/Build/output/win64/null_vs2022_debug_win64_true/combat.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload boot log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-gate-boot-log
          path: ${{ runner.temp }}/unit_gate_boot.log
          if-no-files-found: ignore

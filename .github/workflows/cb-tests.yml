# CityBuilder tests -- active PR + push gate on master.
#
# Mirrors dp-tests.yml (the DevilsPlayground gate). The Null-backend build
# boot mode (Zenith_CommandLine::IsHeadless) short-circuits Flux init / VMA
# leaf functions / Editor flush paths / view-creation null-handle asserts, so
# the suite runs on GPU-less GitHub windows-latest runners.
#
# As of ZM-D-146 CityBuilder has ZERO graphics-gated tests: all 45 RUN on the
# Null backend, including the terrain entity (the "skip terrain headless" guard
# is gone -- see Q-2026-07-21-001). The previous note here named
# CB_Deform* / CB_Paint* / CB_Physics* as the graphics-mandatory set; no tests
# by those names have ever existed.
#
# Required check name: `cb-tests`.
#
# Runtime DLLs are fetched per run (same as dp-tests; too large to commit):
#   - slang-llvm.dll: 105 MB. Fetched from Slang v2026.1 GitHub release.
#   - vulkan-1.dll: copied from LunarG Vulkan SDK 1.3.290.0 install.

name: cb-tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner override (e.g. self-hosted with GPU).'
        required: false
        default: 'windows-latest'

permissions:
  contents: read

# Superseded PR pushes cancel the in-flight run; master pushes always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cb-tests:
    name: cb-tests
    runs-on: ${{ github.event.inputs.runner || 'windows-latest' }}
    timeout-minutes: 60

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      VCPKG_DISABLE_METRICS: 1
      SLANG_VERSION: '2026.1'
      VULKAN_SDK_VERSION: '1.3.290.0'
      # Single source for where the runner writes + the artifact uploads from
      # (runner default is the same; pinned here so a future move is a 1-line edit).
      CB_RESULTS_DIR: Build/artifacts/test_results/citybuilder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision Zenith toolchain (MSBuild + vcpkg + Vulkan + Slang)
        uses: ./.github/actions/zenith-setup
        with:
          vulkan-sdk-version: ${{ env.VULKAN_SDK_VERSION }}
          slang-version: ${{ env.SLANG_VERSION }}

      - name: Regenerate solution (Sharpmake)
        shell: pwsh
        working-directory: Build
        run: |
          ./regen.ps1 -UseDotnet
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build CityBuilder
        shell: pwsh
        run: |
          msbuild Games\CityBuilder\citybuilder_win64.sln `
              /t:CityBuilder `
              /p:Configuration=Vulkan_vs2022_Debug_Win64_True `
              /p:Platform=x64 `
              /p:WindowsTargetPlatformVersion=10.0 `
              -maxCpuCount `
              -nologo `
              -clp:Summary `
              -clp:ErrorsOnly
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build CityBuilder (Null backend -- THE headless/CI build)
        shell: pwsh
        run: |
          # Everything below this point runs THIS exe. The Vulkan build above stays
          # as a compile proof for the real renderer; it is never executed here (a
          # Vulkan boot hangs in vkEnumeratePhysicalDevices on a GPU-less runner).
          msbuild Games\\CityBuilder\\citybuilder_win64.sln `
              /t:CityBuilder `
              /p:Configuration=Null_vs2022_Debug_Win64_True `
              /p:Platform=x64 `
              /p:WindowsTargetPlatformVersion=10.0 `
              -maxCpuCount `
              -nologo `
              -clp:Summary `
              -clp:ErrorsOnly
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build CityBuilder (D3D12 null backend -- backend-neutrality link proof)
        shell: pwsh
        run: |
          # The D3D12 null backend is a compile + link conformance oracle proving
          # the Flux renderer surface is backend-neutral (it does zero real
          # rendering; Vulkan stays the shipping backend). The _False runtime
          # config omits editor/tools + Slang/Vulkan; it links the system d3d12/
          # dxgi import libs only. A clean link here = every concept + non-concept
          # call the engine makes is satisfied by a second backend.
          msbuild Games\CityBuilder\citybuilder_win64.sln `
              /t:CityBuilder `
              /p:Configuration=D3D12_vs2022_Debug_Win64_False `
              /p:Platform=x64 `
              /p:WindowsTargetPlatformVersion=10.0 `
              -maxCpuCount `
              -nologo `
              -clp:Summary `
              -clp:ErrorsOnly
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Copy runtime DLLs into exe output dir
        shell: pwsh
        run: |
          $exeDir = 'Games\CityBuilder\Build\output\win64\null_vs2022_debug_win64_true'
          if (-not (Test-Path $exeDir)) {
              Write-Error "exe output dir does not exist: $exeDir"
              exit 1
          }
          # Repair-ZenithRuntimeDlls is the single source of truth for what an exe
          # dir needs: the whole slang dependency tree (the post-build event only
          # copies slang.dll) plus the assimp runtime tree. A FIRST build in a new
          # config leaves those absent and the exe dies with STATUS_DLL_NOT_FOUND
          # (exit 0xC0000135) before main() -- an empty log that reads as a build
          # failure. No vulkan-1.dll: the Null backend never loads a Vulkan loader.
          Import-Module Build\zenith_buildsystem.psm1 -Force
          $copied = Repair-ZenithRuntimeDlls -ExeDir (Resolve-Path $exeDir).Path
          Write-Host "healed $($copied.Count) runtime DLL(s): $($copied -join ', ')"
          Write-Host "DLLs in exe output dir:"
          Get-ChildItem "$exeDir\*.dll" | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}} | Sort-Object Name | Format-Table -AutoSize | Out-String | Write-Host

      - name: Verify exe boots far enough to enumerate tests
        shell: pwsh
        run: |
          $exe = 'Games\CityBuilder\Build\output\win64\null_vs2022_debug_win64_true\citybuilder.exe'
          # --list-automated-tests exits 0 cleanly without entering the main loop.
          # The Null build creates no Vulkan instance at all, so
          # vkEnumeratePhysicalDevices never runs on the GPU-less runner.
          $out = & $exe --list-automated-tests --skip-tool-exports --skip-unit-tests 2>&1
          $code = $LASTEXITCODE
          Write-Host "exe --list exited $code; first 30 lines:"
          $out | Select-Object -First 30 | Out-Host
          if ($code -ne 0) {
              Write-Host "... tail (last 40 lines) ..."
              $out | Select-Object -Last 40 | Out-Host
              Write-Error "exe failed to enumerate tests (exit $code) -- engine can't boot on this runner."
              exit 1
          }

      - name: Run CityBuilder tests
        shell: pwsh
        run: |
          # zenith test batches every registered test in one headless process;
          # graphics-mandatory terrain tests (m_bRequiresGraphics) are skipped
          # on the GPU-less runner.
          & .\zenith.bat test CityBuilder --headless --results-dir $env:CB_RESULTS_DIR
          $testExit = $LASTEXITCODE
          Write-Host "zenith test exit: $testExit"
          if ($testExit -ne 0) { exit $testExit }

      - name: Upload test result JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb-test-results
          path: ${{ env.CB_RESULTS_DIR }}/
          if-no-files-found: warn

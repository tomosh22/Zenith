# ScriptTest tests (active PR gate).
#
# Modeled on zm-tests.yml / dp-tests.yml (see dp-tests.yml's header for the full
# history of the headless-boot approach). Summary of the constraints:
#   - GitHub-hosted windows-latest runners have no GPU / Vulkan ICD. Headless is
#     a BUILD CONFIG: the Null_* configs compile the GPU-less Zenith/Null backend
#     and create the window hidden, so every render path RUNS against no-op
#     backend calls instead of being skipped by a runtime branch. Only tests that
#     read PIXELS (m_bRequiresGraphics) are skipped.
#   - slang-llvm.dll is > 100 MB, so Slang DLLs are fetched per run by
#     .github/actions/zenith-setup, never committed.
#
# ★ THE BUILD AND TEST LINES BELOW ARE COPIED VERBATIM FROM THE ScriptTest
# CATEGORY IN zagent.project.json, character for character. Root CLAUDE.md:
# "Gate command lines are copied VERBATIM from this repo's own docs and CI,
# never paraphrased." Two additions are deliberate and are the only ones:
# `--tests ScriptTest_Boot_Test` on the cold-bake line, and `--results-dir` on
# the full run so the artifact upload has a fixed path.
#
# Unlike zm-tests / dp-tests this workflow drives `zenith` rather than msbuild
# directly, which is what makes the lines identical to the gates. Two steps
# those files need therefore disappear here: `zenith build` calls
# Repair-ZenithRuntimeDlls itself (no manual DLL copy), and it heals the exe dir
# before anything runs it (no separate boot-probe step). There is also no unit
# gate: ScriptTest has no row in Tools/unit_baselines.json, and deliberately so
# -- Test_UnitBaselineManifest.ps1 requires every row there to be named by some
# workflow's -Game or declared advisory, so an ungated pin cannot be added
# silently. ScriptTest's coverage is its automated tests.
#
# Required check name: `st-tests` (branch protection is a manual GitHub-UI step).

name: st-tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner override (e.g. self-hosted with GPU).'
        required: false
        default: 'windows-latest'

permissions:
  contents: read

# Superseded PR pushes cancel the in-flight run; master pushes always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  st-tests:
    name: st-tests
    runs-on: ${{ github.event.inputs.runner || 'windows-latest' }}
    timeout-minutes: 60

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      VCPKG_DISABLE_METRICS: 1
      SLANG_VERSION: '2026.1'
      VULKAN_SDK_VERSION: '1.3.290.0'
      # Single source for where the runner writes + the artifact uploads from.
      ST_RESULTS_DIR: Build/artifacts/test_results/scripttest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision Zenith toolchain (MSBuild + vcpkg + Vulkan + Slang)
        uses: ./.github/actions/zenith-setup
        with:
          vulkan-sdk-version: ${{ env.VULKAN_SDK_VERSION }}
          slang-version: ${{ env.SLANG_VERSION }}

      - name: Regenerate solution (Sharpmake)
        shell: pwsh
        working-directory: Build
        run: |
          ./regen.ps1 -UseDotnet
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build ScriptTest (Null backend -- THE headless/CI build)
        shell: pwsh
        run: |
          # Everything below this point runs THIS exe. `--headless` is a CONFIG
          # SELECTOR (Null_vs2022_Debug_Win64_True), not a runtime flag: the Null
          # build creates no Vulkan instance at all, so vkEnumeratePhysicalDevices
          # never runs on the GPU-less runner. Tools are ON in that config, which
          # is what makes the boot authoring pass below possible.
          pwsh -NoProfile -File Tools\zenith.ps1 build ScriptTest --headless
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build ScriptTest (D3D12 null backend -- backend-neutrality link proof)
        shell: pwsh
        run: |
          # The D3D12 null backend is a compile + link conformance oracle proving
          # the Flux renderer surface is backend-neutral (zero real rendering;
          # Vulkan stays the shipping backend). _False omits editor/tools +
          # Slang/Vulkan and links the system d3d12/dxgi import libs only.
          #
          # For ScriptTest this leg carries a second meaning: the fifteen
          # BuildGraph_ST_* builders are compiled UNCONDITIONALLY (unlike Combat's,
          # which sit inside #ifdef ZENITH_TOOLS) because the hermetic tests
          # reference every one of them. Tools-gating them would break exactly this
          # link.
          pwsh -NoProfile -File Tools\zenith.ps1 build ScriptTest --config D3D12_vs2022_Debug_Win64_False
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Cold-bake stale-scene guard
        shell: pwsh
        run: |
          # ★ CI-ONLY, AND IT HAS TO BE. ScriptTest's .zscen files (seven today)
          # are COMMITTED, and they are also re-authored from scratch by
          # Project_RegisterEditorAutomationSteps on every tools boot. Those two
          # facts only stay consistent if the recipes in ScriptTest.cpp still
          # reproduce the committed bytes -- and nothing notices when they stop:
          # a run that loads the committed scene renders fine while its recipe
          # rots, and a recipe change that a developer forgot to commit renders
          # fine too, on their machine, forever.
          #
          # So this deletes every one of them and makes the boot re-author them
          # from nothing. Locally the same step would be actively harmful: it would
          # throw away legitimately-in-progress scene edits every time it ran,
          # which is why it lives here and not in a gate line.
          #
          # Three assertions, because each catches something the others cannot:
          #   (i)   all of them exist again    -> every recipe actually RAN (a
          #                                       silently-skipped scene leaves a
          #                                       hole a diff cannot see, since a
          #                                       deleted file with no replacement
          #                                       is a deletion, not a difference)
          #   (ii)  git diff is clean          -> the bytes MATCH the committed ones
          #   (iii) porcelain is empty         -> no untracked strays (a renamed
          #                                       scene would satisfy (ii) by
          #                                       leaving the old file untouched)
          #
          # ★ THE FILE LIST IS DERIVED FROM GIT, NEVER SPELLED OUT HERE. The
          # guard's SUBJECT is "every committed .zscen", so restating the set is
          # a second place to be wrong -- and it fails OPEN rather than closed: a
          # scene added to the repo without being added to a hardcoded list is
          # never deleted, so it never differs, so `git diff` stays clean and its
          # recipe escapes this check forever. `git ls-files` IS the committed
          # set, by definition. An EMPTY result is treated as a failure for the
          # same reason: a guard with nothing to delete passes vacuously.
          #
          # We branch on native exit codes ourselves, so do not let pwsh 7.4+ turn
          # a non-zero `git` into a terminating error before the message is printed.
          $PSNativeCommandUseErrorActionPreference = $false

          $sceneDir = 'Games/ScriptTest/Assets/Scenes'
          $scenes = @(git ls-files -- "$sceneDir/*.zscen")
          if ($LASTEXITCODE -ne 0) {
              Write-Error "git ls-files failed under ${sceneDir}; cannot derive the committed scene set."
              exit 1
          }
          if ($scenes.Count -eq 0) {
              Write-Error "no committed .zscen under ${sceneDir} -- this guard would pass having checked nothing. Failing instead."
              exit 1
          }
          Write-Host ("committed scenes under ${sceneDir}: " + ($scenes -join ', '))

          foreach ($scene in $scenes) {
              if (-not (Test-Path $scene)) {
                  Write-Error "committed scene missing BEFORE the cold bake: $scene -- the repo, not the bake, is wrong."
                  exit 1
              }
              Remove-Item $scene -Force
          }
          Write-Host "deleted $($scenes.Count) committed scene(s); re-authoring from the boot recipes..."

          # The boot test only has to BOOT: authoring runs before the main loop, so
          # the cheapest registered test is enough to drive it. (--skip-tool-exports,
          # which `zenith test` passes for speed, skips the mesh/texture EXPORT phase
          # only -- Project_InitializeResources and
          # Project_RegisterEditorAutomationSteps run either way.)
          pwsh -NoProfile -File Tools\zenith.ps1 test ScriptTest --headless --tests ScriptTest_Boot_Test
          if ($LASTEXITCODE -ne 0) {
              Write-Error "cold bake failed to run (see log above)"
              exit $LASTEXITCODE
          }

          $missing = @($scenes | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
              Write-Error ("the bake did not re-author: " + ($missing -join ', ') + " -- a scene recipe did not run.")
              exit 1
          }

          git diff --exit-code -- $sceneDir
          if ($LASTEXITCODE -ne 0) {
              Write-Error "re-authored scene bytes DIFFER from the committed ones (diff above). Either the recipe changed and the .zscen was not committed with it, or authoring is no longer deterministic."
              exit 1
          }

          $stray = @(git status --porcelain --untracked-files=all -- $sceneDir)
          if ($stray.Count -gt 0) {
              Write-Error ("unexpected changes under ${sceneDir}:`n" + ($stray -join "`n"))
              exit 1
          }

          Write-Host "cold bake reproduced all $($scenes.Count) committed scenes byte-for-byte."

      - name: Run ScriptTest tests
        shell: pwsh
        run: |
          # zenith test batches every registered test in ONE process. --headless
          # selects the Null-backend exe built above; pixel-reading tests
          # (m_bRequiresGraphics) are skipped there.
          pwsh -NoProfile -File Tools\zenith.ps1 test ScriptTest --headless --results-dir $env:ST_RESULTS_DIR
          $testExit = $LASTEXITCODE
          Write-Host "zenith test exit: $testExit"
          if ($testExit -ne 0) { exit $testExit }

      - name: Upload test result JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st-test-results
          path: ${{ env.ST_RESULTS_DIR }}/
          if-no-files-found: warn

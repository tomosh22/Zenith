# doc-lint (MVP-0.3.2): cross-document consistency check.
#
# Runs Tools/doc_lint.ps1 on every PR + push-to-master. Six checks:
#   1. Test count consistency across Status / TestPlan / BuildEnvironment /
#      AgentBriefing / Shortfalls.
#   2. MVP archetype names agree across docs + Archetypes.json mvp:true.
#   3. Roadmap task IDs are unique.
#   4. No [SUPERSEDED] markers in active text (only DecisionLog).
#   5. No false "X does not exist" claims for files that do exist.
#   6. Cross-references via markdown links resolve.
#
# Each violation is printed in a grep-able single-line form:
#   VIOLATION [check-id] path:line description
# CI fails on any violation.

name: doc-lint

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  doc-lint:
    name: doc-lint
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run doc_lint.ps1 (every game with a Docs tree)
        shell: pwsh
        run: |
          # -Game defaults to DevilsPlayground, so passing no flag lints THAT GAME
          # ONLY. Zenithmon's docs were never linted here (ZM-62) even though the
          # script has taken -Game for some time -- and C6 (cross-references
          # resolve) is exactly the check that would have caught the dangling
          # ZM-D-177 citation ZM-53 had to fix by hand.
          #
          # Both games run; a failure in EITHER fails the job. Do not early-exit on
          # the first one -- a reader who fixes DevilsPlayground and pushes should
          # not then discover Zenithmon was broken all along.
          $failed = @()
          foreach ($game in @('DevilsPlayground', 'Zenithmon')) {
              Write-Host "::group::doc_lint -Game $game"
              pwsh -NoProfile -File ./Tools/doc_lint.ps1 -Game $game -ShowPassed
              if ($LASTEXITCODE -ne 0) { $failed += $game }
              Write-Host "::endgroup::"
          }
          if ($failed.Count -gt 0) {
              Write-Error "doc_lint failed for: $($failed -join ', ')"
              exit 1
          }

plugins {
	id 'com.android.application'
}

// The Android ABI axis. Shared by every game so adding an ABI is one edit; the
// Sharpmake-side mirror is ZenithAndroidAbi in Build/Sharpmake_Common.cs.
apply from: '../../../../Build/zenith_android_abis.gradle'

android {
	namespace 'com.zenith.combat'
	compileSdk 34

	defaultConfig {
		applicationId 'com.zenith.combat'
		minSdk 26
		targetSdk 34
		versionCode 1
		versionName '1.0'

		ndk {
			abiFilters.addAll(zenithAbis.keySet())
		}
	}

	// Ship native libs uncompressed + page-aligned in the APK (paired with
	// android:extractNativeLibs="false" in the manifest) instead of the legacy
	// compressed-and-extracted-to-disk packaging. Required for Google Play's
	// 16 KB page-size compliance (AGDE1112) -- our .so is already compiled
	// 16 KB-aligned (see the linker's -Wl,-z,max-page-size=16384 in
	// Build/Sharpmake_Games.cs), but that alignment is meaningless unless the
	// library is also stored, not extracted, at that alignment in the APK.
	packagingOptions {
		jniLibs {
			useLegacyPackaging = false
		}
	}

	buildTypes {
		debug {}
		release {
			minifyEnabled false
		}
		agdeRelease {
			initWith release
			signingConfig signingConfigs.debug
			matchingFallbacks = ['release']
		}
	}

	sourceSets {
		main {
			// Bundle game assets and engine assets into the APK
			assets.srcDirs = [
				'../../Assets',
				'../../../../Zenith/Assets'
			]
			// Native libraries staged by deploy_android.bat
			jniLibs.srcDirs = ['jniLibs']
		}
	}
}

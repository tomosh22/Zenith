android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m

# NO org.gradle.java.home here, deliberately. It is an ABSOLUTE, machine-local
# path: pinned in a tracked file it hard-fails ("Java home supplied is invalid")
# on any machine without that exact JDK, and Gradle does NOT fall back to
# JAVA_HOME once the property is set. It also silently split the games -- two had
# it and three did not, so the same command worked or failed depending on which
# game you were in.
#
# Select the JDK per-MACHINE instead, once, for every game:
#   %USERPROFILE%\.gradle\gradle.properties
#     org.gradle.java.home=C\:/Program Files/Android/Android Studio/jbr
# or point JAVA_HOME at a JDK that Gradle 8.13 supports (17-23; it rejects 24+).

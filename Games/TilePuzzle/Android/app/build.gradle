plugins {
	id 'com.android.application'
}

// The Android ABI axis + the per-ABI jniLibs roots. Shared by every game so
// adding an ABI is one edit; the Sharpmake-side mirror is ZenithAndroidAbi in
// Build/Sharpmake_Common.cs.
apply from: '../../../../Build/zenith_android_abis.gradle'

android {
	namespace 'com.zenith.tilepuzzle'
	compileSdk 34

	defaultConfig {
		applicationId 'com.zenith.tilepuzzle'
		minSdk 26
		targetSdk 34
		versionCode 1
		versionName '1.0'

		ndk {
			abiFilters.addAll(zenithAbis.keySet())
		}
	}

	buildTypes {
		debug {}
		release {
			minifyEnabled false
			signingConfig signingConfigs.debug
		}
	}

	sourceSets {
		main {
			// Bundle game assets, engine assets, and pre-compiled shaders into the APK
			assets.srcDirs = [
				'../../Assets',
				'../../../../Zenith/Assets',
				'../../../../Zenith/Flux/Shaders'
			]
		}
		// src/<type>/jniLibs carries hand-staged extras (e.g. the downloaded
		// Vulkan validation layer), staged independently for each supported ABI.
		debug {
			jniLibs.srcDirs = zenithJniLibDirs('debug') + ['src/debug/jniLibs']
		}
		release {
			jniLibs.srcDirs = zenithJniLibDirs('release')
		}
	}
}

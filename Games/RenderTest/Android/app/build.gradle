plugins {
	id 'com.android.application'
}

// The Android ABI axis. Shared by every game so adding an ABI is one edit; the
// Sharpmake-side mirror is ZenithAndroidAbi in Build/Sharpmake_Common.cs.
apply from: '../../../../Build/zenith_android_abis.gradle'

android {
	namespace 'com.zenith.rendertest'
	compileSdk 34

	defaultConfig {
		applicationId 'com.zenith.rendertest'
		minSdk 26
		targetSdk 34
		versionCode 1
		versionName '1.0'

		ndk {
			abiFilters.addAll(zenithAbis.keySet())
		}
	}

	buildTypes {
		debug {}
		release {
			minifyEnabled false
		}
	}

	sourceSets {
		main {
			assets.srcDirs = [
				'../../Assets',
				'../../../../Zenith/Assets'
			]
			jniLibs.srcDirs = ['jniLibs']
		}
	}
}

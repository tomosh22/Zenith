// :app module — produces the APK that AGDE installs. namespace +
// applicationId follow the same com.zenith.<game> pattern as Combat.
// abiFilters comes from the shared ABI axis (every ABI Sharpmake generates
// agde configs for); sdk levels mirror Combat for consistency across
// DP-flagship vs prototype games.
plugins {
	id 'com.android.application'
}

// The Android ABI axis. Shared by every game so adding an ABI is one edit; the
// Sharpmake-side mirror is ZenithAndroidAbi in Build/Sharpmake_Common.cs.
apply from: '../../../../Build/zenith_android_abis.gradle'

android {
	namespace 'com.zenith.devilsplayground'
	compileSdk 34

	defaultConfig {
		applicationId 'com.zenith.devilsplayground'
		minSdk 26
		targetSdk 34
		versionCode 1
		versionName '1.0'

		ndk {
			abiFilters.addAll(zenithAbis.keySet())
		}
	}

	buildTypes {
		debug {}
		release {
			minifyEnabled false
		}
	}

	sourceSets {
		main {
			// Bundle game assets and engine assets into the APK
			assets.srcDirs = [
				'../../Assets',
				'../../../../Zenith/Assets'
			]
			// Native libraries staged by deploy_android.bat
			jniLibs.srcDirs = ['jniLibs']
		}
	}
}
